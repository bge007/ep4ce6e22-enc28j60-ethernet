  <g font-family="IBM Plex Mono, monospace" font-size="9" fill="#69736e">
    <text x="30" y="1122">Wires cross â€” follow the colour, not the path. Dashed purple INT is optional (milestone 1 polls EPKTCNT over SPI instead).</text>
    <text x="30" y="1140">PIN_101 is marked âœ—: it is the nCEO configuration pin, which the FPGA drives while configuring â€” leave it empty.</text>
    <text x="30" y="1158">The two nodes are wired identically. Only the MAC/IP constants in the bitstream differ, plus the cable, which must cross.</text>
